name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  backend:
    name: Test backend API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      JWT_SECRET: ci-test-secret
      DB_PATH: ${{ runner.temp }}/ci-test.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Start API
        run: |
          node index.js > server.log 2>&1 &
          for i in $(seq 1 20); do curl -sf http://localhost:4000/api/health && break; sleep 1; done
      - name: Health check
        run: curl -sf http://localhost:4000/api/health
      - name: Register, login and /me
        run: |
          set -e
          B=http://localhost:4000/api/auth
          H='Content-Type: application/json'
          curl -sf -X POST -H "$H" -d '{"name":"CI User","email":"ci@example.com","password":"password123"}' $B/register
          TOKEN=$(curl -sf -X POST -H "$H" -d '{"email":"ci@example.com","password":"password123"}' $B/login | node -pe "JSON.parse(require('fs').readFileSync(0)).token")
          curl -sf -H "Authorization: Bearer $TOKEN" $B/me
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "$H" -d '{"email":"ci@example.com","password":"wrongpass1"}' $B/login)
          [ "$code" = "401" ]
      - name: Show server log on failure
        if: failure()
        run: cat server.log